<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFM Dashboard — Sign In</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            from { opacity:0; transform:translateY(30px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .logo { text-align:center; margin-bottom:32px; }
        .logo h1 {
            font-size:26px; font-weight:700;
            background: linear-gradient(135deg,#667eea,#764ba2);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .logo p { color:#95a5a6; font-size:13px; margin-top:6px; }

        .btn-google {
            width:100%; padding:13px; border:2px solid #e0e0e0; border-radius:8px;
            background:white; font-size:15px; font-weight:600; color:#3c4043;
            cursor:pointer; display:flex; align-items:center; justify-content:center;
            gap:10px; transition:background 0.2s, border-color 0.2s; margin-bottom:20px;
        }
        .btn-google:hover { background:#f8f9fa; border-color:#bbb; }
        .btn-google svg { width:20px; height:20px; flex-shrink:0; }

        .divider {
            display:flex; align-items:center; gap:12px;
            color:#bdc3c7; font-size:12px; margin-bottom:20px;
        }
        .divider::before, .divider::after {
            content:''; flex:1; height:1px; background:#ecf0f1;
        }

        .form-group { margin-bottom:18px; }
        .form-group label {
            display:block; font-size:12px; font-weight:700;
            text-transform:uppercase; letter-spacing:0.5px;
            color:#7f8c8d; margin-bottom:7px;
        }
        .form-group input {
            width:100%; padding:12px 16px; border:2px solid #ecf0f1;
            border-radius:8px; font-size:15px; color:#2c3e50;
            transition:border-color 0.2s; outline:none;
        }
        .form-group input:focus { border-color:#667eea; }

        .btn-signin {
            width:100%; padding:14px;
            background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            color:white; border:none; border-radius:8px;
            font-size:15px; font-weight:700; cursor:pointer;
            transition:opacity 0.2s, transform 0.1s; margin-top:4px;
        }
        .btn-signin:hover  { opacity:0.92; }
        .btn-signin:active { transform:scale(0.98); }
        .btn-signin:disabled { opacity:0.6; cursor:not-allowed; }

        .error-box {
            background:#fdf0f0; border:1px solid #f5c6cb;
            border-left:4px solid #e74c3c; color:#721c24;
            padding:12px 16px; border-radius:8px; font-size:14px; margin-bottom:18px;
        }

        .footer-links { text-align:center; margin-top:24px; font-size:13px; color:#95a5a6; }
        .footer-links a { color:#667eea; text-decoration:none; font-weight:600; }
        .footer-links a:hover { text-decoration:underline; }

        .spinner {
            width:18px; height:18px; border:2px solid rgba(255,255,255,0.4);
            border-top-color:white; border-radius:50%;
            animation:spin 0.7s linear infinite; display:inline-block; vertical-align:middle;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>📊 RFM Dashboard</h1>
        <p>Sign in to access the analytics</p>
    </div>

    {% if error %}
    <div class="error-box">⚠️ {{ error }}</div>
    {% endif %}

    <!-- Google OAuth -->
    <button class="btn-google" onclick="signInWithGoogle()" id="googleBtn">
        <svg viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.8 6.1C12.4 13 17.8 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8C43.7 37.5 46.5 31.4 46.5 24.5z"/>
            <path fill="#FBBC05" d="M10.4 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.8-6.1A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.8-6.1z"/>
            <path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.5-5.6l-7.5-5.8c-2.1 1.4-4.8 2.3-8 2.3-6.2 0-11.5-4.2-13.5-9.9l-7.8 6.1C6.6 42.6 14.6 48 24 48z"/>
        </svg>
        Continue with Google
    </button>

    <div class="divider">or sign in with username</div>

    <!-- Username / Password -->
    <form method="POST" action="/login" onsubmit="handleSubmit(event)">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter your username"
                   value="{{ username or '' }}" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password"
                   autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-signin" id="submitBtn">Sign In</button>
    </form>

    <div class="footer-links">
        Don't have an account? <a href="/register">Create one</a>
    </div>
    <div style="text-align:center;margin-top:10px;font-size:11px;color:#ddd;">Internal use only</div>
</div>

<script>
    const _supabaseUrl  = {{ supabase_url  | tojson }};
    const _supabaseKey  = {{ supabase_key  | tojson }};
    const sb = (typeof supabase !== 'undefined' && _supabaseUrl && _supabaseKey)
        ? supabase.createClient(_supabaseUrl, _supabaseKey)
        : null;

    async function signInWithGoogle() {
        if (!sb) { alert('Supabase is not configured.'); return; }
        const btn = document.getElementById('googleBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>&nbsp; Redirecting...';
        const { error } = await sb.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin + '/auth/callback' }
        });
        if (error) {
            btn.disabled = false;
            btn.innerHTML = '⚠️ ' + error.message;
        }
    }

    function handleSubmit(e) {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>';
    }
</script>
</body>
</html>
